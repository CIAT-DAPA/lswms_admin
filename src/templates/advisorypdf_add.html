{% extends 'layout.html' %}
{% block body %}
<div class="container-fluid d-flex justify-content-center" style="min-height: 80vh;">
    <div class="col-md-8">
        <h2 class="card-title text-center">Add Advisory PDF</h2>

        <div class="card">
            <div class="card-body">
                <form method="POST" action="/advisorypdf/add" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Name (SCENARIO):</label>
                        <input type="text" class="form-control" name="name" required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Type:</label>
                        <select class="form-select" name="type" required>
                            <option value="" disabled selected>Select type...</option>
                            {% for t in types %}
                            <option value="{{ t }}">{{ t }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description:</label>
                        <textarea class="form-control" name="description" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">PDF file:</label>
                        <input type="file" class="form-control" name="pdf_file" accept=".pdf" required />
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Add
                        </button>
                        <a href="/advisorypdf" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
