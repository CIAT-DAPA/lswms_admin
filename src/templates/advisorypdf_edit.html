{% extends 'layout.html' %}
{% block body %}
<div class="container-fluid d-flex justify-content-center" style="min-height: 80vh;">
    <div class="col-md-8">
        <h2 class="card-title text-center">Edit Advisory PDF</h2>

        <div class="card">
            <div class="card-body">
                <form method="POST" action="/advisorypdf/edit/{{ doc.id }}" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Name (SCENARIO):</label>
                        <input type="text" class="form-control" name="name" value="{{ doc.name }}" required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Type:</label>
                        <select class="form-select" name="type" required>
                            {% for t in types %}
                            <option value="{{ t }}" {% if doc.type.value==t %}selected{% endif %}>{{ t }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description:</label>
                        <textarea class="form-control" name="description"
                            rows="3">{{ doc.description or '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Current file:</label>
                        <p class="form-control-plaintext"><strong>{{ doc.filename }}</strong></p>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Replace PDF file (optional):</label>
                        <input type="file" class="form-control" name="pdf_file" accept=".pdf" />
                        <small class="text-muted">Leave empty to keep the current file.</small>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-warning">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <a href="/advisorypdf" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
